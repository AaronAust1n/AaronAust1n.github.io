<svg xmlns="http://www.w3.org/2000/svg" width="660" height="490" viewBox="0 0 660 490">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="660" height="490" fill="#ffffff"/>

  <text x="330" y="37" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">《记忆碎片》与 LLM 的架构对照</text>
  <text x="330" y="56" font-size="10" fill="#64748b" text-anchor="middle">Memento and the LLM: an architecture mapping</text>

  <text x="170" y="76" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Leonard</text>
  <text x="485" y="76" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">LLM</text>

  <!-- Row 1: y=95 -->
  <rect x="25" y="95" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="165" y="117.2" font-size="12" fill="#9d174d" text-anchor="middle">纹身</text>
  <text x="165" y="134.2" font-size="9" fill="#9d174d" text-anchor="middle">tattoos</text>
  <path d="M310,122 L324,122" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="335" y="95" width="300" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="485" y="117.2" font-size="12" fill="#6b21a8" text-anchor="middle">System Prompt</text>
  <text x="485" y="134.2" font-size="9" fill="#6b21a8" text-anchor="middle">permanent, tamper-proof rules</text>

  <!-- Row 2: y=174 -->
  <rect x="25" y="174" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="165" y="196.2" font-size="12" fill="#9d174d" text-anchor="middle">拍立得与注释</text>
  <text x="165" y="213.2" font-size="9" fill="#9d174d" text-anchor="middle">polaroids with notes</text>
  <path d="M310,201 L324,201" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="335" y="174" width="300" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="485" y="196.2" font-size="12" fill="#6b21a8" text-anchor="middle">RAG</text>
  <text x="485" y="213.2" font-size="9" fill="#6b21a8" text-anchor="middle">retrieve from external memory</text>

  <!-- Row 3: y=253 -->
  <rect x="25" y="253" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="165" y="275.2" font-size="12" fill="#9d174d" text-anchor="middle">受伤前的记忆</text>
  <text x="165" y="292.2" font-size="9" fill="#9d174d" text-anchor="middle">memories before the injury</text>
  <path d="M310,280 L324,280" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="335" y="253" width="300" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="485" y="275.2" font-size="12" fill="#6b21a8" text-anchor="middle">Pre-training data</text>
  <text x="485" y="292.2" font-size="9" fill="#6b21a8" text-anchor="middle">frozen, with a cutoff date</text>

  <!-- Row 4: y=332 -->
  <rect x="25" y="332" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="165" y="354.2" font-size="12" fill="#9d174d" text-anchor="middle">被 Natalie 操控</text>
  <text x="165" y="371.2" font-size="9" fill="#9d174d" text-anchor="middle">manipulated by Natalie</text>
  <path d="M310,359 L324,359" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="335" y="332" width="300" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="485" y="354.2" font-size="12" fill="#6b21a8" text-anchor="middle">Prompt Injection</text>
  <text x="485" y="371.2" font-size="9" fill="#6b21a8" text-anchor="middle">can't tell instruction from input</text>

  <!-- Row 5: y=411 -->
  <rect x="25" y="411" width="280" height="54" rx="8" fill="#fce7f3" stroke="#ec4899"/>
  <text x="165" y="433.2" font-size="12" fill="#9d174d" text-anchor="middle">给自己写假笔记</text>
  <text x="165" y="450.2" font-size="9" fill="#9d174d" text-anchor="middle">writing himself a false note</text>
  <path d="M310,438 L324,438" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="335" y="411" width="300" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="485" y="433.2" font-size="12" fill="#6b21a8" text-anchor="middle">Fine-tuning</text>
  <text x="485" y="450.2" font-size="9" fill="#6b21a8" text-anchor="middle">reshaping future behavior</text>
</svg>