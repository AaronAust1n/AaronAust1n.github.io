<svg xmlns="http://www.w3.org/2000/svg" width="660" height="310" viewBox="0 0 660 310">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="660" height="310" fill="#ffffff"/>

  <text x="330" y="37" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">资本的两种去向</text>
  <text x="330" y="56" font-size="10" fill="#64748b" text-anchor="middle">Two destinations for capital</text>

  <!-- Source: x=240, y=85, w=180, h=54, bottom=139 -->
  <rect x="240" y="85" width="180" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="330" y="107.2" font-size="12" fill="#1e40af" text-anchor="middle">资本追逐利润</text>
  <text x="330" y="124.2" font-size="9" fill="#1e40af" text-anchor="middle">Capital follows returns</text>

  <path d="M310,144 C 270,156 170,146 170,153" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>
  <path d="M350,144 C 390,156 490,146 490,153" fill="none" stroke="#f59e0b" marker-end="url(#arrow-amber)"/>

  <!-- A: x=25, y=164, w=290, h=72, bottom=236 -->
  <rect x="25" y="164" width="290" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="170" y="185.7" font-size="12" fill="#1e40af" text-anchor="middle">方向 A：改善现实</text>
  <text x="170" y="203.7" font-size="9" fill="#1e40af" text-anchor="middle">建学校、修基建、改善劳动条件</text>
  <text x="170" y="221.7" font-size="10" fill="#1e40af" text-anchor="middle">回报慢 · 利润薄 · 成功即消灭市场</text>

  <!-- B: x=345, y=164, w=290 -->
  <rect x="345" y="164" width="290" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="490" y="185.7" font-size="12" fill="#b45309" text-anchor="middle">方向 B：替代现实</text>
  <text x="490" y="203.7" font-size="9" fill="#b45309" text-anchor="middle">短剧、游戏、社交、虚拟世界</text>
  <text x="490" y="221.7" font-size="10" fill="#b45309" text-anchor="middle">回报快 · 利润厚 · 现实越糟市场越大</text>

  <!-- Feedback loop B -> A -->
  <path d="M490,241 C 490,300 170,300 170,247" fill="none" stroke="#ef4444" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="330" y="264" font-size="10" fill="#64748b" text-anchor="middle">越逃避，越没有动力改善现实</text>
</svg>