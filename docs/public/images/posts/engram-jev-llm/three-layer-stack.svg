<svg xmlns="http://www.w3.org/2000/svg" width="440" height="406" viewBox="160 0 440 406">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect x="160" y="0" width="440" height="406" fill="#ffffff"/>

  <text x="380" y="37" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">分层智能：编译期、运行时、慢推理</text>
  <text x="380" y="56" font-size="10" fill="#64748b" text-anchor="middle">Layered intelligence: compile-time, runtime, slow reasoning</text>

  <!-- L0: x=200, w=360, y=85, h=72, bottom=157 -->
  <rect x="200" y="85" width="360" height="72" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="106.7" font-size="12" fill="#166534" text-anchor="middle">L0 · 条件记忆</text>
  <text x="380" y="124.7" font-size="9" fill="#166534" text-anchor="middle">Engram 表 / NGM / Engram Adapter</text>
  <text x="380" y="142.7" font-size="10" fill="#166534" text-anchor="middle">编译期 · O(1) 确定性寻址</text>

  <path d="M380,162 L380,171" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>

  <!-- Jev: y=182, h=72, bottom=254 -->
  <rect x="200" y="182" width="360" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="203.7" font-size="12" fill="#6b21a8" text-anchor="middle">L1/L2 · Jev（~300ms）</text>
  <text x="380" y="221.7" font-size="9" fill="#6b21a8" text-anchor="middle">路由判断 · 步骤验收 · 阈值决策</text>
  <text x="380" y="239.7" font-size="10" fill="#6b21a8" text-anchor="middle">运行时 · 高频闭环，带校准概率</text>

  <path d="M380,259 L380,268" fill="none" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>

  <!-- LLM: y=279, h=72, bottom=351 -->
  <rect x="200" y="279" width="360" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="300.7" font-size="12" fill="#1e40af" text-anchor="middle">L3 · LLM 慢推理</text>
  <text x="380" y="318.7" font-size="9" fill="#1e40af" text-anchor="middle">规划 · 生成 · 长链条推理</text>
  <text x="380" y="336.7" font-size="10" fill="#1e40af" text-anchor="middle">运行时 · 内部含 L0 的记忆支撑</text>

  <text x="380" y="379" font-size="10" fill="#64748b" text-anchor="middle">不对称约束：L0 编译期固定，L1–L3 运行时决策——能力变更走发版流程，不走热更新。</text>
</svg>